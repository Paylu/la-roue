function collectActiveMods(selections) {

  return mods;
}
function computeOptionWeight(option, wheelKey, mods) {
  let factor = 1;
  for (const mod of mods) {
    if (mod.targetWheel !== wheelKey) continue;
    if (mod.matchTag === "*") factor *= mod.mult;
    else if (mod.matchId && mod.matchId === option.id) factor *= mod.mult;
    else if (mod.matchTag && option.tags?.includes(mod.matchTag)) factor *= mod.mult;
  }
  return Math.max(0.01, option.weight * factor);
}

  if (effect.type === "reroll") {

    if (target === "auto_highest" || target === "auto_lowest") {
      const sorted = [...STAT_KEYS].sort((a, b) => target === "auto_highest" ? (liveStatsNow[b] ?? 0) - (liveStatsNow[a] ?? 0) : (liveStatsNow[a] ?? 0) - (liveStatsNow[b] ?? 0));
      target = `stat_${sorted[0]}`;
    }
    if (target === "mount" && race.mobilityMode === "body") target = "weapon";
    if (target.startsWith("stat_")) {

      return { key: target, label: `Relance : ${STAT_LABELS[sk]}`, pool: buildTierPool(target, STAT_TIER_LABELS[sk]), section: "personnalite", rerollTarget: target, rerollMode: effect.mode || "replace" };

    if (!pool) return null;

/* ================================================================ */

function fitRadialLabel(text, angleWidthDeg, rStart, rEnd) {
  const maxFont = 15, minFont = 6.5;
  const radialLength = (rEnd - rStart) * 0.92;
  const midR = (rStart + rEnd) / 2;
  const halfRad = ((angleWidthDeg / 2) * Math.PI) / 180;
  const chordAtMid = 2 * midR * Math.sin(halfRad) * 0.88;
  const charW = 0.58;
  const len = Math.max(text.length, 1);
  let fontSize = Math.min(maxFont, radialLength / (len * charW), chordAtMid);
  if (fontSize >= minFont) return { text, fontSize };
  const maxChars = Math.max(3, Math.floor(radialLength / (minFont * charW)));
  const truncated = text.length > maxChars ? text.slice(0, maxChars - 1) + "…" : text;
  return { text: truncated, fontSize: minFont };
}
function radialLabelProps(mid, cx, cy, rStart, rEnd) {
  const from = polarToCartesian(cx, cy, rEnd, mid);
  const to = polarToCartesian(cx, cy, rStart, mid);
  const rotation = (Math.atan2(to.y - from.y, to.x - from.x) * 180) / Math.PI;
  return { x: from.x, y: from.y, rotation, anchor: "start" };
}

function Wheel({ optionsWithDyn, onResult, onPointerUpdate, hue = "#8B7A9E", autoSpin = false }) {
  const [rotation, setRotation] = useState(0);
  const [spinning, setSpinning] = useState(false);
  const [pending, setPending] = useState(null);
  const wheelRef = useRef(null);
  const gradUid = useId().replace(/:/g, "");
  const maxBaseWeight = Math.max(0.01, ...optionsWithDyn.map((o) => o.weight || 0.01));
  const sortedOptions = useMemo(() => {
    const bucketOrder = { commun: 0, rare: 1, epique: 2, legendaire: 3 };
    return [...optionsWithDyn].sort((a, b) => bucketOrder[rarityBucketFromWeight(a.weight, maxBaseWeight)] - bucketOrder[rarityBucketFromWeight(b.weight, maxBaseWeight)]);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [optionsWithDyn]);
  const angled = withAngles(sortedOptions);
  const size = 460, cx = size / 2, cy = size / 2, r = size / 2 - 8;

  useEffect(() => {
    const seg = segmentAtTop(angled, rotation);
    if (seg) onPointerUpdate(seg.name);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (!spinning) return;
    let raf;
    const tick = () => {
      const deg = readWheelRotationDeg(wheelRef.current);
      const seg = segmentAtTop(angled, deg);
      if (seg) onPointerUpdate(seg.name);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [spinning]);

  const spin = () => {
    if (spinning) return; setSpinning(true);
    const { picked, share } = weightedPickWithMeta(optionsWithDyn);
    const withA = angled.find((o) => o.id === picked.id);
    const mid = (withA.start + withA.end) / 2;
    const jitter = (Math.random() - 0.5) * (withA.end - withA.start) * 0.5;
    const targetAngle = mid + jitter;
    const deltaCCW = ((targetAngle % 360) + 360) % 360;
    const spins = 4 + Math.floor(Math.random() * 5); // entre 4 et 8 tours complets, variable à chaque lancer
    setPending({ picked, share }); setRotation((rr) => rr - spins * 360 - deltaCCW);
  };

  useEffect(() => {
    if (!autoSpin) return;
    const t = setTimeout(() => spin(), 450);
    return () => clearTimeout(t);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const [landFlash, setLandFlash] = useState(null);
  const handleEnd = () => {
    if (pending) {
      const res = pending; setPending(null); setSpinning(false);
      onPointerUpdate(res.picked.name);
      const bucket = rarityBucketFromWeight(res.picked.weight, maxBaseWeight);
      setLandFlash(bucket);
      setTimeout(() => setLandFlash(null), bucket === "legendaire" ? 900 : 550);
      onResult(res.picked, res.share);
    }
  };

  return (
    <div className="wheel-block">
      <div className={`stage ${landFlash ? `land-flash-${landFlash}` : ""}`}>
        <div className="pointer" /><div className="ring-outer" />
        <div ref={wheelRef} className="wheel-wrap" style={{ transform: `rotate(${rotation}deg)` }} onTransitionEnd={handleEnd}>
          <svg viewBox={`0 0 ${size} ${size}`} className="wheel-svg">
            <defs>
              {Object.entries(TIER_GRADIENT).map(([tier, cfg]) => (
                <radialGradient id={`wgrad-${gradUid}-${tier}`} key={tier} cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stopColor={shade(hue, cfg.light)} />
                  <stop offset="100%" stopColor={shade(hue, cfg.dark)} />
                </radialGradient>
              ))}
              <filter id={`wglow-${gradUid}`} x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>
            {angled.map((o) => {
              const bucket = rarityBucketFromWeight(o.weight, maxBaseWeight);
              const cfg = TIER_GRADIENT[bucket];
              return <path key={o.id} d={arcPath(cx, cy, r, o.start, o.end)} fill={`url(#wgrad-${gradUid}-${bucket})`} stroke={`rgba(201,162,75,${cfg.strokeOpacity})`} strokeWidth={cfg.strokeW} filter={bucket === "legendaire" ? `url(#wglow-${gradUid})` : undefined} />;
            })}
            {angled.map((o) => {
              const mid = (o.start + o.end) / 2;
              const angleWidth = o.end - o.start;
              const lbl = radialLabelProps(mid, cx, cy, r * 0.2, r * 0.92);
              const fit = fitRadialLabel(o.name, angleWidth, r * 0.2, r * 0.92);
              return <text key={o.id + "_lbl"} x={lbl.x} y={lbl.y} transform={`rotate(${lbl.rotation} ${lbl.x} ${lbl.y})`} textAnchor={lbl.anchor} dominantBaseline="middle" fontSize={fit.fontSize} className="wheel-label">{fit.text}</text>;
            })}
          </svg>
        </div>
        <div className="hub"><Sparkles size={24} color="#C9A24B" /></div>
      </div>
      <div className="wheel-controls">
        <button className="spin-btn" onClick={spin} disabled={spinning}>{spinning ? "La roue tourne…" : "Lancer la roue"}</button>
        <div className="wheel-caption">La taille de chaque secteur reflète sa probabilité.</div>
      </div>
    </div>
  );
}

/* ================================================================ */
/* DUEL — avec mécaniques spéciales (duelTag)                         */
/* ================================================================ */

function simulateDuel(a, b) {
  let hpA = 40 + a.stats.resistance * 6, hpB = 40 + b.stats.resistance * 6;
  const maxA = hpA, maxB = hpB; const log = [];
  const dodgeUsed = { a: false, b: false }, reviveUsed = { a: false, b: false };
  const dmgFor = (atk, def, hpDef, maxDef) => {
    let d = Math.max(3, Math.round(atk.attaque - def.stats.resistance * 1.2));
    if (def.resistanceId === "physique") d = Math.round(d * 0.82);
    if (def.weaknessId !== "aucune" && atk.powerTags?.includes(def.weaknessId.toUpperCase())) d = Math.round(d * 1.3);
    if (atk.hasOrcFury) { const missing = 1 - hpDef / maxDef; d = Math.round(d * (1 + missing * 0.5)); }
    return d;
  };
  function strike(atkC, defC, atkSide, hpDef, maxDef) {
    const defSide = atkSide === "a" ? "b" : "a";
    if (defC.duelTag === "esquive_totale_1" && !dodgeUsed[defSide]) {
      dodgeUsed[defSide] = true;
      log.push({ text: `${atkC.race} frappe avec ${atkC.weapon} — esquivé !`, side: atkSide, hpA, hpB });
      return hpDef;
    }
    const d = dmgFor(atkC, defC, hpDef, maxDef);
    let newHp = Math.max(0, hpDef - d);
    if (atkC.duelTag === "vol_de_vie") {
      const heal = Math.round(d * 0.3);
      if (atkSide === "a") hpA = Math.min(maxA, hpA + heal); else hpB = Math.min(maxB, hpB + heal);
    }
    if (newHp <= 0 && defC.duelTag === "renaissance" && !reviveUsed[defSide]) {
      reviveUsed[defSide] = true;
      newHp = Math.round(maxDef * 0.2);
      log.push({ text: `${atkC.race} porte un coup fatal avec ${atkC.weapon} — mais ${defC.race} refuse de tomber !`, side: atkSide, hpA, hpB });
    } else {
      log.push({ text: `${atkC.race} frappe avec ${atkC.weapon} — ${d} dégâts.`, side: atkSide, hpA, hpB });
    }
    return newHp;
  }
  const first = a.duelTag === "premier_frappe" ? "a" : b.duelTag === "premier_frappe" ? "b" : (a.stats.vitesse >= b.stats.vitesse ? "a" : "b");
  let round = 1;
  while (hpA > 0 && hpB > 0 && round <= 14) {
    const order = first === "a" ? ["a", "b"] : ["b", "a"];
    for (const side of order) {
      if (hpA <= 0 || hpB <= 0) break;
      const hits = (side === "a" ? a : b).duelTag === "double_strike" ? 2 : 1;
      for (let h = 0; h < hits; h++) {
        if (hpA <= 0 || hpB <= 0) break;
        if (side === "a") hpB = strike(a, b, "a", hpB, maxB);
        else hpA = strike(b, a, "b", hpA, maxA);
      }
    }
    round++;
  }
  let winner;
  if (hpA <= 0 && hpB <= 0) winner = "draw"; else if (hpA <= 0) winner = "b"; else if (hpB <= 0) winner = "a"; else winner = hpA / maxA >= hpB / maxB ? "a" : "b";
  return { log, winner, hpA, hpB, maxA, maxB };
}

  return (
    <div className="chapter-screen">
      <button className="back-btn" onClick={onBack}><ChevronLeft size={16} /> Sommaire</button>
      <div className="chapter-eyebrow">Tome {tome.numeral}</div>
      <h1 className="chapter-title">{tome.title}</h1>
      <p className="chapter-subtitle">{tome.subtitle}</p>
      {tome.draft && <DraftBadge />}

      {tome.id === "tome1" && (
        <div className="chapter-body">
          {TOME1_SECTIONS.map((s, i) => (
            <div key={i} className="lore-section">
              <div className="lore-section-title">{s.title}</div>
              <p className="lore-section-text">{s.text}</p>
            </div>
          ))}
        </div>
      )}

      {tome.empty && (
        <div className="chapter-body">
          <p className="empty-chapter-text">Ce tome n'a pas encore été écrit. Il attend son tour, comme le reste.</p>
        </div>
      )}

      {tome.id === "tome3" && (
        <div className="chapter-body faction-grid">
          {FACTIONS_LORE.map((f) => <FactionEntry key={f.numeral} f={f} />)}
        </div>
      )}

      {tome.id === "tome4" && (
        <div className="chapter-body peuple-grid">
          {PEUPLES_LORE.map(([name, lore]) => <PeupleEntry key={name} name={name} lore={lore} />)}
        </div>
      )}

      {tome.id === "tome5" && (
        <div className="chapter-body">
          {chars === null && !loadErr && <p className="empty-chapter-text">Consultation des archives…</p>}
          {loadErr && <p className="empty-chapter-text">Impossible de consulter les archives des personnages pour l'instant.</p>}
          {chars && chars.length === 0 && <p className="empty-chapter-text">Aucun personnage n'a encore rejoint les archives canoniques. Le premier est encore à venir.</p>}
          {chars && chars.length > 0 && (
            <div className="char-grid">
              {chars.map((c) => <CharacterEntry key={c.id} c={c} />)}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function LivreDuMonde() {
  const [openTome, setOpenTome] = useState(null);
  return (
    <div className="livre-root">
      {openTome ? <ChapterView tome={openTome} onBack={() => setOpenTome(null)} /> : <Cover onOpen={setOpenTome} />}
    </div>
  );
}

function App() {
  const [view, setView] = useState("forge");
  const [sidePanelTab, setSidePanelTab] = useState("live");
  const [racePicked, setRacePicked] = useState(null);
  const [steps, setSteps] = useState([]);
  const [stageIdx, setStageIdx] = useState(0);
  const [selections, setSelections] = useState({});
  const [spinMeta, setSpinMeta] = useState([]);
  const [knownSources, setKnownSources] = useState([]);
  const liveStatsRef = useRef({});
  const [, forceTick] = useState(0);
  const bumpStats = (updater) => { liveStatsRef.current = updater(liveStatsRef.current); forceTick((t) => t + 1); };
  const [history, setHistory] = useState([]);
  const historyRef = useRef([]);
  const pushHistory = (entries) => { const arr = Array.isArray(entries) ? entries : [entries]; historyRef.current = [...historyRef.current, ...arr]; setHistory(historyRef.current); };
  const resetHistory = (entries) => { historyRef.current = entries; setHistory(historyRef.current); };
  const [flash, setFlash] = useState(null);
  const [pointerName, setPointerName] = useState("");
  const pendingTimeoutRef = useRef(null);
  const handleReroll = () => {
    if (pendingTimeoutRef.current) clearTimeout(pendingTimeoutRef.current);
    setFlash(null); setPointerName("");
  };
  const [finalChar, setFinalChar] = useState(null);
  const [savedInRoster, setSavedInRoster] = useState(false);

  const [roster, setRoster] = useState([]);
  const [rosterLoaded, setRosterLoaded] = useState(false);
  const [storageError, setStorageError] = useState(false);
  const [duelPick, setDuelPick] = useState([]);
  const [duelResult, setDuelResult] = useState(null);
  const [visibleLog, setVisibleLog] = useState(0);

  useEffect(() => { (async () => {
    try { const raw = localStorage.getItem("characters_v15"); if (raw) setRoster(JSON.parse(raw)); } catch (e) {}
    setRosterLoaded(true);
  })(); }, []);
  const persistRoster = useCallback(async (next) => {
    setRoster(next);
    try { localStorage.setItem("characters_v15", JSON.stringify(next)); }
    catch (e) { setStorageError(true); }
  }, []);

  const exportRoster = () => {
    const blob = new Blob([JSON.stringify(roster, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `roue-du-destin-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const fileInputRef = useRef(null);
  const [importMode, setImportMode] = useState(null);
  const triggerImport = () => fileInputRef.current?.click();
  const handleImportFile = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed)) throw new Error("format invalide");
        setImportMode({ parsed });
      } catch (err) { alert("Fichier invalide — ce n'est pas une sauvegarde reconnue."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  const confirmImport = (mode) => {
    if (!importMode) return;
    if (mode === "replace") persistRoster(importMode.parsed);
    else {
      const existingIds = new Set(roster.map((c) => c.id));
      persistRoster([...roster, ...importMode.parsed.filter((c) => !existingIds.has(c.id))]);
    }
    setImportMode(null);
  };

  const activeMods = useMemo(() => collectActiveMods(selections), [selections]);
  const raceOptionsDyn = useMemo(() => RACES.map((o) => ({ ...o, dynWeight: o.weight })), []);
  const currentStep = steps[stageIdx];
  const currentOptionsDyn = useMemo(() => {
    if (!currentStep) return [];
    let pool = currentStep.pool;
    if (currentStep.key === "titre") pool = pool.filter((o) => !o.condition || o.condition(selections, liveStatsRef.current));
    return pool.map((o) => {
      let w = computeOptionWeight(o, currentStep.key, activeMods);
      if (currentStep.key === "weakness" && selections.resistance && selections.resistance.id !== "aucune" && o.id === selections.resistance.id) w *= 0.02;
      return { ...o, dynWeight: w };
    });
  }, [currentStep, activeMods, selections]);

  function clampVal(v) { return Math.max(0, Math.min(13, v)); }
  function resolveStatDraw(statKey, raw) {
    const mods = []; let bonus = 0;
    for (const [label, vm] of knownSources) { const d = vm?.[statKey]; if (d) { bonus += d; mods.push({ source: label, delta: d }); } }
    const final = clampVal(raw + bonus);
    return { final, mods, raw };
  }

  const handleRaceResult = (picked, share) => {
    setFlash({ name: picked.name, mods: valueModsToChips(picked.valueMods), lore: picked.lore, unlocked: picked.specialWheels.map((id) => SPECIAL_WHEELS[id].label) });
    pendingTimeoutRef.current = setTimeout(() => {
      setFlash(null); setRacePicked(picked);
      setSelections({ race: picked }); setSpinMeta([{ share }]);
      const raceSteps = picked.specialWheels.map((id) => ({ key: id, label: SPECIAL_WHEELS[id].label, pool: SPECIAL_WHEELS[id].pool, section: "identite" }))
        .concat([{ key: "archetype", label: "Archétype", pool: ARCHETYPES, section: "identite" }, { key: "faction", label: "Faction", pool: FACTIONS, section: "identite" },
          { key: "taille", label: "Taille", pool: taillePoolFor(picked), section: "identite" }]);
      setSteps(raceSteps); setStageIdx(0);
      resetHistory([{ section: "identite", label: "Race", resultDisplay: picked.name, mods: valueModsToChips(picked.valueMods) }]);
    }, flashDelay(picked));
  };

  const handleStepResult = (picked, share) => {
    const key = currentStep.key;
    let immediateMods = [];
    if (currentStep.statKey) immediateMods = resolveStatDraw(currentStep.statKey, picked.value).mods;
    else if (picked.valueMods) immediateMods = valueModsToChips(picked.valueMods);
    setFlash({ name: picked.name, mods: immediateMods, lore: picked.lore, unlocked: [] });

    const nextSelections = { ...selections, [key]: picked };
    const nextMeta = [...spinMeta, { share }];

    pendingTimeoutRef.current = setTimeout(() => {
      setFlash(null); setSelections(nextSelections); setSpinMeta(nextMeta);
      let workingSteps = steps;

      if (currentStep.section === "identite" && key === "taille") {
        const sources = [["Race: " + nextSelections.race.name, nextSelections.race.valueMods]];
        for (const [k, v] of Object.entries(nextSelections)) {
          if (["race", "archetype", "faction", "taille"].includes(k)) continue;
          if (v && v.name) sources.push([v.name, v.valueMods]);
        }
        sources.push(["Archétype: " + nextSelections.archetype.name, nextSelections.archetype.valueMods]);
        sources.push(["Faction: " + nextSelections.faction.name, nextSelections.faction.valueMods]);
        sources.push(["Taille: " + nextSelections.taille.name, nextSelections.taille.valueMods]);
        setKnownSources(sources);
        workingSteps = [...workingSteps, ...buildStatSteps()];
        setSteps(workingSteps);
      }

      if (currentStep.isBonusWheel) {
        pushHistory({ section: "personnalite", label: "Étincelle du Destin", resultDisplay: picked.name, mods: valueModsToChips(picked.valueMods) });
        if (picked.valueMods) {
          for (const [sk, delta] of Object.entries(picked.valueMods)) {
            bumpStats((s) => ({ ...s, [sk]: clampVal((s[sk] ?? 0) + delta) }));
          }
        }
      } else if (currentStep.rerollTarget) {
        const target = currentStep.rerollTarget;
        if (target.startsWith("stat_")) {
          const sk = target.slice(5);
          const { final: newFinal, raw } = resolveStatDraw(sk, picked.value);
          bumpStats((s) => {
            const old = s[sk] ?? 0;
            const kept = currentStep.rerollMode === "keepWorst" ? Math.min(old, newFinal) : currentStep.rerollMode === "keepBest" ? Math.max(old, newFinal) : newFinal;
            pushHistory({ section: "personnalite", label: currentStep.label, resultDisplay: `${tierLabelFor(sk, old)} → ${tierLabelFor(sk, kept)}`, mods: [] });
            return { ...s, [sk]: kept };
          });
        } else {
          const oldPicked = selections[target];
          const protectedTarget = target !== "weakness";
          const keepOld = protectedTarget && oldPicked && typeof oldPicked.weight === "number" && typeof picked.weight === "number" && oldPicked.weight < picked.weight;
          const finalPicked = keepOld ? oldPicked : picked;
          nextSelections[target] = finalPicked;
          pushHistory({ section: "personnalite", label: currentStep.label, resultDisplay: keepOld ? `${finalPicked.name} (conservé — déjà plus rare)` : finalPicked.name, mods: keepOld ? [] : valueModsToChips(finalPicked.valueMods) });
          if (!keepOld && finalPicked.valueMods) {
            for (const [sk, delta] of Object.entries(finalPicked.valueMods)) {
              bumpStats((s) => ({ ...s, [sk]: clampVal((s[sk] ?? 0) + delta) }));
            }
          }
          if (target === "power" && finalPicked.id !== "aucun_pouvoir" && !nextSelections.pouvoir_maitrise) {
            const injected = { key: "pouvoir_maitrise", label: "Maîtrise du pouvoir", pool: POUVOIR_MAITRISES, section: "pouvoirs" };
            const insertAt = stageIdx + 1;
            workingSteps = [...workingSteps.slice(0, insertAt), injected, ...workingSteps.slice(insertAt)];
            setSteps(workingSteps);
          }
          if (finalPicked.followUp) {
            const injected2 = { key: `followup_${target}_${Date.now()}`, label: finalPicked.followUp.label, pool: finalPicked.followUp.pool, section: currentStep.section };
            const insertAt2 = stageIdx + 1;
            workingSteps = [...workingSteps.slice(0, insertAt2), injected2, ...workingSteps.slice(insertAt2)];
            setSteps(workingSteps);
          }
        }
      } else if (currentStep.statKey) {
        const { final, mods, raw } = resolveStatDraw(currentStep.statKey, picked.value);
        bumpStats((s) => ({ ...s, [currentStep.statKey]: final }));
        pushHistory({ section: "stats", label: STAT_LABELS[currentStep.statKey], resultDisplay: `${tierLabelFor(currentStep.statKey, raw)} → ${tierLabelFor(currentStep.statKey, final)}`, mods });
        if (currentStep.statKey === "resistance") {
          workingSteps = [...workingSteps, ...buildTailSteps(nextSelections.race)];
          setSteps(workingSteps);
        }
      } else {
        pushHistory({ section: currentStep.section, label: currentStep.label, resultDisplay: picked.name, mods: valueModsToChips(picked.valueMods) });
        if (key === "power" && picked.id === "aucun_pouvoir") {
          workingSteps = workingSteps.filter((s) => s.key !== "pouvoir_maitrise");
          setSteps(workingSteps);
        }
        const retroactiveKeys = ["power", "pouvoir_maitrise", "arme_maitrise", "arme_maitrise2", "personnalite", "mount"];
        if (retroactiveKeys.includes(key) && picked.valueMods) {
          for (const [statKey, delta] of Object.entries(picked.valueMods)) {
            bumpStats((s) => {
              const nv = clampVal((s[statKey] ?? 0) + delta);
              pushHistory({ section: "update", label: `${currentStep.label}: ${picked.name}`, resultDisplay: tierLabelFor(statKey, nv), mods: [{ source: STAT_LABELS[statKey], delta }] });
              return { ...s, [statKey]: nv };
            });
          }
        }
        if ((key === "personnalite" || key === "archetype" || key === "titre") && picked.effect && (picked.effect.type === "bonus_wheel" || picked.effect.type === "reroll")) {
          const injected = buildFollowUp(picked.effect, liveStatsRef.current, nextSelections.race || selections.race);
          if (injected) {
            const insertAt = stageIdx + 1;
            workingSteps = [...workingSteps.slice(0, insertAt), injected, ...workingSteps.slice(insertAt)];
            setSteps(workingSteps);
          }
        }
        if (picked.followUp) {
          const injected = { key: `followup_${key}_${Date.now()}`, label: picked.followUp.label, pool: picked.followUp.pool, section: currentStep.section };
          const insertAt = stageIdx + 1;
          workingSteps = [...workingSteps.slice(0, insertAt), injected, ...workingSteps.slice(insertAt)];
          setSteps(workingSteps);
        }
      }

      const isLastStep = stageIdx >= workingSteps.length - 1;
      if (isLastStep) finalizeCharacter(nextSelections, nextMeta);
      else setStageIdx((i) => i + 1);
    }, flashDelay(picked));
  };

  const finalizeCharacter = (sel, meta) => {
    sel = { ...sel, finalStats: liveStatsRef.current };
    const triggered = SYNERGIES.filter((s) => { try { return s.when(sel); } catch { return false; } });
    let statsFinal = { ...liveStatsRef.current }; let rarityBoost = 0; let titleOverride = null; let companion = null;
    let duelTag = sel.race.duelTag || null;
    if (sel.archetype.duelTag) duelTag = sel.archetype.duelTag;
    const extraHistory = [];
    for (const s of triggered) {
      if (s.effect.statBonus) for (const [k, d] of Object.entries(s.effect.statBonus)) { statsFinal[k] = clampVal((statsFinal[k] ?? 0) + d); extraHistory.push({ section: "update", label: `Synergie: ${s.name}`, resultDisplay: tierLabelFor(k, statsFinal[k]), mods: [{ source: s.name, delta: d }] }); }
      if (s.effect.rarityBoost) rarityBoost += s.effect.rarityBoost;
      if (s.effect.title) titleOverride = s.effect.title;
    }

    const te = sel.titre.effect;
    if (te.type === "stat") { statsFinal[te.stat] = clampVal((statsFinal[te.stat] ?? 0) + te.amount); extraHistory.push({ section: "update", label: `Titre: ${sel.titre.name}`, resultDisplay: tierLabelFor(te.stat, statsFinal[te.stat]), mods: [{ source: sel.titre.name, delta: te.amount }] }); }
    else if (te.type === "maxStat" || te.type === "maxStatForceWeakness") {
      const maxKey = STAT_KEYS.reduce((best, k) => (statsFinal[k] ?? 0) > (statsFinal[best] ?? 0) ? k : best, STAT_KEYS[0]);
      statsFinal[maxKey] = clampVal((statsFinal[maxKey] ?? 0) + te.amount);
      extraHistory.push({ section: "update", label: `Titre: ${sel.titre.name}`, resultDisplay: tierLabelFor(maxKey, statsFinal[maxKey]), mods: [{ source: sel.titre.name, delta: te.amount }] });
    }
    else if (te.type === "minStat") {
      const minKey = STAT_KEYS.reduce((worst, k) => (statsFinal[k] ?? 0) < (statsFinal[worst] ?? 0) ? k : worst, STAT_KEYS[0]);
      statsFinal[minKey] = clampVal((statsFinal[minKey] ?? 0) + 1);
      extraHistory.push({ section: "update", label: `Titre: ${sel.titre.name}`, resultDisplay: tierLabelFor(minKey, statsFinal[minKey]), mods: [{ source: sel.titre.name, delta: 1 }] });
    }
    else if (te.type === "allStat") { for (const k of STAT_KEYS) statsFinal[k] = clampVal((statsFinal[k] ?? 0) + te.amount); }
    else if (te.type === "duelTag") duelTag = te.tag;
    else if (te.type === "rarityBoost") rarityBoost += te.amount;
    else if (te.type === "companion") companion = te.value;
    pushHistory(extraHistory);

    const attaque = sel.weapon.atk + (sel.weapon2 ? sel.weapon2.atk * 0.5 : 0) + Math.max(statsFinal.force, statsFinal.intelligence) * 4;
    const avgSurprise = meta.reduce((s, m) => s + (1 - m.share), 0) / meta.length;
    const anomalyScore = Math.round(avgSurprise * 100);
    const rankOf = (tier) => TIER[tier].rank;
    const baseRank = (rankOf(sel.race.tier) + rankOf(sel.archetype.tier) + rankOf(sel.faction.tier) + rankOf(sel.power.tier) + rankOf(sel.weapon.tier)) / 5;
    const anomalyBonus = (anomalyScore / 100) * 2;
    const totalRank = Math.max(0, Math.min(7, Math.round(baseRank + rarityBoost + anomalyBonus)));
    const rarete = RARITY_SCALE[totalRank];
    const title = titleOverride || sel.titre.name;
    const tags = new Set(sel.race.tags);
    [sel.archetype, sel.faction, sel.power, sel.weapon, sel.mount].forEach((x) => x?.tags?.forEach((t) => tags.add(t)));

    setFinalChar({
      id: `${Date.now()}-${Math.floor(Math.random() * 9999)}`, title,
      race: sel.race.name, raceLore: sel.race.lore, racialTrait: sel.race.racialTrait || null, requesterName: "",
      specialPicks: sel.race.specialWheels.map((id) => ({ label: SPECIAL_WHEELS[id].label, name: sel[id]?.name })),
      archetype: sel.archetype.name, faction: sel.faction.name, taille: sel.taille.name,
      stats: statsFinal, resistance: sel.resistance.name, resistanceId: sel.resistance.id,
      weakness: sel.weakness.name, weaknessId: sel.weakness.id,
      power: sel.power.name, powerTags: sel.power.tags, maitrisePouvoir: sel.pouvoir_maitrise?.name || "—",
      weapon: sel.weapon.name, maitriseArme: sel.arme_maitrise.name,
      weapon2: sel.weapon2?.name || null, weapon2Atk: sel.weapon2?.atk || 0, maitriseArme2: sel.arme_maitrise2?.name || null,
      mount: sel.race.mobilityMode === "body" ? "Son propre corps" : sel.mount.name,
      personnalite: sel.personnalite.name, companion, duelTag,
      attaque: Math.round(attaque), anomalyScore, rarete, rarityRank: totalRank, tags: Array.from(tags),
      synergies: triggered.filter((s) => s.effect.note).map((s) => ({ name: s.name, note: s.effect.note, type: s.type })), hasOrcFury: sel.race.id === "orc",
      history: historyRef.current,
    });
    setSavedInRoster(false);
  };

  const resetForge = () => {
    setRacePicked(null); setSteps([]); setStageIdx(0); setSelections({}); setSpinMeta([]);
    setKnownSources([]); liveStatsRef.current = {}; resetHistory([]);
    setFinalChar(null); setSavedInRoster(false); setFlash(null);
  };
  const saveCurrent = () => { if (!finalChar) return; persistRoster([...roster, finalChar]); setSavedInRoster(true); };
  const deleteChar = (id) => { persistRoster(roster.filter((c) => c.id !== id)); setDuelPick((p) => p.filter((x) => x !== id)); };
  const toggleDuelPick = (id) => setDuelPick((p) => p.includes(id) ? p.filter((x) => x !== id) : (p.length >= 2 ? [p[1], id] : [...p, id]));
  const startDuel = () => {
    if (duelPick.length !== 2) return;
    const a = roster.find((c) => c.id === duelPick[0]); const b = roster.find((c) => c.id === duelPick[1]);
    setDuelResult({ a, b, ...simulateDuel(a, b) }); setVisibleLog(0); setView("duel");
  };
  useEffect(() => {
    if (view !== "duel" || !duelResult) return;
    if (visibleLog >= duelResult.log.length) return;
    const t = setTimeout(() => setVisibleLog((v) => v + 1), 460);
    return () => clearTimeout(t);
  }, [view, duelResult, visibleLog]);

  const totalSteps = 1 + steps.length;
  const currentIndexDisplay = racePicked ? stageIdx + 2 : 1;

  return (
    <div className="app-root">
      <Style />
      <nav className="topnav">
        <button className={`nav-btn ${view === "forge" ? "active" : ""}`} onClick={() => setView("forge")}><Sparkles size={14} /> Forge</button>
        <button className={`nav-btn ${view === "roster" || view === "duel" ? "active" : ""}`} onClick={() => setView("roster")}><Users size={14} /> Arène {roster.length > 0 && <span className="badge">{roster.length}</span>}</button>
        <button className={`nav-btn ${view === "livre" ? "active" : ""}`} onClick={() => setView("livre")}><BookOpen size={14} /> Livre du Monde</button>
      </nav>
      {storageError && <div className="storage-warning">La sauvegarde locale a échoué.</div>}

      {view === "forge" && !finalChar && !racePicked && (
        <div className="forge-layout">
          <div className="forge-screen">
            <div className="eyebrow">Tirage 1</div>
            <div className="wheel-title-row"><PersonStanding size={22} color="var(--gold)" /><h1>Race</h1></div>
            {!flash && <div className="pointer-readout">{pointerName}</div>}
            {flash ? <FlashPanel flash={flash} onReroll={handleReroll} /> : <Wheel key="race" optionsWithDyn={raceOptionsDyn} onResult={handleRaceResult} onPointerUpdate={setPointerName} hue="#C9A24B" />}
          </div>
        </div>
      )}

      {view === "forge" && !finalChar && racePicked && currentStep && (
        <div className="forge-layout">
          <div className="forge-screen">
            <div className="eyebrow">Tirage {currentIndexDisplay}/{totalSteps}</div>
            <div className="wheel-title-row">{(() => { const Icon = iconForStep(currentStep); return <Icon size={22} color="var(--gold)" />; })()}<h1>{currentStep.label}</h1></div>
            {!flash && <div className="pointer-readout">{pointerName}</div>}
            <div className="progress-track"><div className="progress-fill" style={{ width: `${(stageIdx / steps.length) * 100}%` }} /></div>
            {flash ? <FlashPanel flash={flash} onReroll={handleReroll} /> : <Wheel key={currentStep.key} optionsWithDyn={currentOptionsDyn} onResult={handleStepResult} onPointerUpdate={setPointerName} hue={wheelHue(currentStep)} autoSpin />}
            <PowerLevelBar liveStats={liveStatsRef.current} />
          </div>
          <div className="side-panel-wrap">
            <div className="side-tabs">
              <button className={`side-tab ${sidePanelTab === "live" ? "active" : ""}`} onClick={() => setSidePanelTab("live")}>Fiche en direct</button>
              <button className={`side-tab ${sidePanelTab === "history" ? "active" : ""}`} onClick={() => setSidePanelTab("history")}>Historique</button>
            </div>
            {sidePanelTab === "live" ? <LiveSheetPanel selections={selections} liveStats={liveStatsRef.current} race={racePicked} /> : <HistoryPanel history={history} />}
          </div>
        </div>
      )}

      {view === "forge" && finalChar && (
        <div className="reveal-screen">
          <div className="requester-input-wrap">
            <label className="requester-label">Pseudo de la personne qui a demandé ce tirage (optionnel)</label>
            <input
              className="requester-input"
              type="text"
              placeholder="ex : PseudoX"
              value={finalChar.requesterName}
              onChange={(e) => setFinalChar((fc) => fc ? { ...fc, requesterName: e.target.value } : fc)}
            />
          </div>
          <GameCard c={finalChar} />
          <CardActions c={finalChar} onSave={saveCurrent} onNew={resetForge} saved={savedInRoster} />
          <CharacterDetails c={finalChar} />
          {savedInRoster && <div className="saved-hint">Sauvegardé dans l'Arène.</div>}
        </div>
      )}

      {view === "roster" && (
        <div className="roster-screen">
          <div className="eyebrow">Arène</div><h1>Tes personnages</h1>
          <div className="backup-row">
            <button className="pill-btn" onClick={exportRoster} disabled={roster.length === 0}><Save size={13} /> Exporter la sauvegarde</button>
            <button className="pill-btn" onClick={triggerImport}><RefreshCw size={13} /> Importer une sauvegarde</button>
            <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleImportFile} />
          </div>
          {importMode && (
            <div className="import-modal">
              <div className="import-modal-text">{importMode.parsed.length} personnage(s) dans ce fichier. Fusionner avec ta liste actuelle, ou la remplacer entièrement ?</div>
              <div className="import-modal-actions">
                <button className="pill-btn gold" onClick={() => confirmImport("merge")}>Fusionner</button>
                <button className="pill-btn" onClick={() => confirmImport("replace")}>Remplacer</button>
                <button className="pill-btn" onClick={() => setImportMode(null)}>Annuler</button>
              </div>
            </div>
          )}
          {rosterLoaded && roster.length === 0 && <p className="empty-hint">Aucun personnage forgé pour l'instant.</p>}
          <div className="roster-grid">
            {roster.map((c) => (
              <div key={c.id} className={`roster-item ${duelPick.includes(c.id) ? "picked" : ""}`} onClick={() => toggleDuelPick(c.id)}>
                <GameCard c={c} compact /><button className="del-btn" onClick={(e) => { e.stopPropagation(); deleteChar(c.id); }}><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
          {roster.length >= 2 && <button className="spin-btn duel-cta" disabled={duelPick.length !== 2} onClick={startDuel}><Swords size={14} /> Lancer le duel ({duelPick.length}/2)</button>}
        </div>
      )}

      {view === "duel" && duelResult && (
        <div className="duel-screen">
          <button className="close-x" onClick={() => setView("roster")}><X size={18} /></button>
          <div className="eyebrow">Duel</div>
          <div className="duel-header"><div className="duel-fighter">{duelResult.a.title}</div><Swords size={20} color="#C9A24B" /><div className="duel-fighter">{duelResult.b.title}</div></div>
          <div className="hp-bars">
            <HpBar label={duelResult.a.race} current={visibleLog > 0 ? duelResult.log[Math.min(visibleLog, duelResult.log.length) - 1]?.hpA ?? duelResult.maxA : duelResult.maxA} max={duelResult.maxA} color="#5F8FA8" />
            <HpBar label={duelResult.b.race} current={visibleLog > 0 ? duelResult.log[Math.min(visibleLog, duelResult.log.length) - 1]?.hpB ?? duelResult.maxB : duelResult.maxB} max={duelResult.maxB} color="#C97B3E" />
          </div>
          <div className="duel-log">{duelResult.log.slice(0, visibleLog).map((l, i) => <div key={i} className={`log-line ${l.side}`}>{l.text}</div>)}</div>
          {visibleLog >= duelResult.log.length && <div className="duel-outcome">{duelResult.winner === "draw" ? "Égalité." : `${duelResult.winner === "a" ? duelResult.a.title : duelResult.b.title} remporte le duel.`}</div>}
        </div>
      )}

      {view === "livre" && <LivreDuMonde />}
    </div>
  );
}

      .pill-btn{ display:flex; align-items:center; gap:6px; background:none; border:1px solid var(--panel-border); color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; padding:8px 14px; cursor:pointer; }
      .pill-btn:hover{ border-color:var(--text); color:var(--text); }
      .pill-btn.gold{ border-color:var(--gold); color:var(--gold); }
      .saved-hint{ margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); }
      .requester-input-wrap{ width:100%; max-width:320px; margin-bottom:16px; display:flex; flex-direction:column; gap:6px; }
      .requester-label{ font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); text-align:center; }
      .requester-input{ background:var(--panel); border:1px solid var(--panel-border); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px; text-align:center; }
      .requester-input:focus{ outline:none; border-color:var(--gold); }
      .empty-hint{ color:var(--text-dim); font-size:13px; text-align:center; }
      .backup-row{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:14px 0 6px; }
      .import-modal{ width:100%; max-width:400px; background:var(--panel); border:1px solid var(--gold); padding:16px; margin-bottom:16px; text-align:center; }
      .import-modal-text{ font-size:13px; margin-bottom:12px; }
      .import-modal-actions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
      .roster-grid{ display:grid; grid-template-columns:1fr; gap:14px; width:100%; margin-top:10px; }
      @media(min-width:520px){ .roster-grid{ grid-template-columns:1fr 1fr; } }
      .roster-item{ position:relative; cursor:pointer; opacity:0.75; }
      .roster-item .card{ width:100%; pointer-events:none; }
      .roster-item.picked{ opacity:1; }
      .roster-item.picked .card{ box-shadow:0 0 0 2px var(--gold), 0 0 40px -6px var(--rc); }
      .del-btn{ position:absolute; top:8px; right:8px; background:rgba(11,10,16,0.7); border:1px solid var(--panel-border); color:var(--text-dim); padding:5px; cursor:pointer; }
      .duel-screen{ position:relative; }
      .close-x{ position:absolute; top:0; right:0; background:none; border:none; color:var(--text-dim); cursor:pointer; }
      .duel-header{ display:flex; align-items:center; gap:16px; margin-bottom:22px; font-family:'Fraunces',serif; font-size:14px; text-align:center; }
      .hp-bars{ width:100%; display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
      .hp-bar-label{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); margin-bottom:4px; }
      .hp-bar-track{ height:8px; background:var(--panel); border:1px solid var(--panel-border); }
      .hp-bar-fill{ height:100%; transition:width .4s ease; }
      .duel-log{ width:100%; min-height:180px; display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
      .log-line{ font-family:'JetBrains Mono',monospace; font-size:12px; padding:8px 10px; border-left:2px solid var(--panel-border); color:var(--text-dim); }
      .log-line.a{ border-left-color:#5F8FA8; } .log-line.b{ border-left-color:#C97B3E; }
      .duel-outcome{ font-family:'Fraunces',serif; font-size:16px; text-align:center; color:var(--gold); padding-top:8px; border-top:1px solid var(--panel-border); width:100%; }
      .livre-root{ width:100%; display:flex; flex-direction:column; align-items:center; }
      .cover-screen{ width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; text-align:center; }
      .cover-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--text-dim); margin:14px 0 6px; }
      .cover-title{ font-family:'Fraunces',serif; font-weight:800; font-size:clamp(32px,7vw,48px); margin:0 0 10px; }
      .cover-tagline{ font-style:italic; color:var(--text-dim); font-size:14px; margin-bottom:36px; }

      .tome-list{ width:100%; display:flex; flex-direction:column; gap:12px; }
      .tome-card{ position:relative; display:flex; align-items:center; gap:14px; text-align:left; background:var(--panel); border:1px solid var(--panel-border); padding:16px 18px; cursor:pointer; color:var(--text); transition:border-color .2s; }
      .tome-card:hover{ border-color:var(--gold); }
      .tome-card-numeral{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; color:var(--gold); width:26px; flex-shrink:0; }
      .tome-card-text{ flex:1; }
      .tome-card-title{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
      .tome-card-subtitle{ font-size:12px; color:var(--text-dim); margin-top:2px; }
      .tome-card-badge{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); border:1px solid var(--panel-border); padding:3px 7px; flex-shrink:0; }

      .chapter-screen{ width:100%; max-width:760px; }
      .back-btn{ display:flex; align-items:center; gap:4px; background:none; border:none; color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; margin-bottom:26px; padding:0; }
      .back-btn:hover{ color:var(--gold); }
      .chapter-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); }
      .chapter-title{ font-family:'Fraunces',serif; font-weight:800; font-size:clamp(26px,5vw,36px); margin:6px 0 6px; }
      .chapter-subtitle{ color:var(--text-dim); font-size:13px; font-style:italic; margin-bottom:10px; }
      .draft-badge{ display:inline-block; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#C97B3E; border:1px solid #C97B3E; padding:4px 9px; margin-bottom:20px; }
      .chapter-body{ margin-top:16px; }
      .empty-chapter-text{ color:var(--text-dim); font-style:italic; font-size:14px; }

      .lore-section{ margin-bottom:22px; padding-bottom:20px; border-bottom:1px solid var(--panel-border); }
      .lore-section:last-child{ border-bottom:none; }
      .lore-section-title{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--gold); margin-bottom:6px; }
      .lore-section-text{ font-size:14px; line-height:1.7; color:var(--text); max-width:68ch; }

      .faction-grid, .peuple-grid, .char-grid{ display:grid; grid-template-columns:1fr; gap:16px; }
      @media(min-width:680px){ .faction-grid, .peuple-grid, .char-grid{ grid-template-columns:1fr 1fr; } }

      .faction-entry{ background:var(--panel); border:1px solid var(--panel-border); padding:18px; }
      .faction-entry-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
      .faction-numeral{ font-family:'Fraunces',serif; font-weight:700; color:var(--gold); font-size:16px; }
      .faction-name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; }
      .faction-line{ font-size:12.5px; line-height:1.6; margin:0 0 8px; color:var(--text); }
      .faction-line strong{ color:var(--gold); font-weight:600; }
      .faction-fs-row{ display:flex; gap:10px; margin-top:10px; }
      .faction-fs{ flex:1; font-size:11.5px; background:var(--bg); border:1px solid var(--panel-border); padding:8px 10px; }
      .fs-label{ display:block; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:3px; }

      .peuple-entry{ background:var(--panel); border:1px solid var(--panel-border); padding:14px 16px; }
      .peuple-name{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; color:var(--gold); margin-bottom:4px; }
      .peuple-lore{ font-size:12.5px; font-style:italic; color:var(--text-dim); line-height:1.5; }

      .char-entry{ background:var(--panel); border:1px solid var(--rc, var(--panel-border)); padding:14px 16px; }
      .char-entry-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
      .char-entry-rarity{ font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--rc, var(--gold)); margin:3px 0 8px; }
      .char-entry-line{ font-size:12px; color:var(--text-dim); }
      .char-entry-title{ font-size:11px; font-style:italic; color:var(--text-dim); margin-top:4px; }
    `}</style>
  );
}
